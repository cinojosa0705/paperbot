[package]
name = "paperbot"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloy = { version = "1", features = ["signer-local", "sol-types", "k256"] }
alloy-sol-types = "1"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
rand = "0.8"
# reqwest brings ring, tokio-tungstenite brings aws-lc-rs; pick ring explicitly at startup
iced = { version = "0.13", features = ["tokio", "image", "svg", "canvas"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "paperbot"
path = "src/main.rs"

[[bin]]
name = "paperbot-gui"
path = "src/bin/gui.rs"
